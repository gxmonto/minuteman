spring.application.name=timetrack
server.port=${PORT:8080}

# ----- database (credentials only from the environment, never committed) -----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/timetracker}
spring.datasource.username=${DB_USERNAME:timetrack}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.mvc.problemdetails.enabled=true
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false

management.endpoints.web.exposure.include=health

# ----- auth -----
timetrack.jwt.secret=${JWT_SECRET}
timetrack.jwt.ttl=${JWT_TTL:PT12H}
timetrack.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
timetrack.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# ----- notifications (es | en) -----
timetrack.locale=${APP_LOCALE:es}
timetrack.push.fcm.enabled=${FCM_ENABLED:false}
timetrack.push.fcm.project-id=${FCM_PROJECT_ID:}
timetrack.push.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}

# ----- reminders / geofence -----
timetrack.reminders.timer-open-after=PT4H
timetrack.reminders.work-day-open-after=PT12H
timetrack.reminders.repeat-every=PT1H
timetrack.reminders.left-site-repeat-every=PT15M
timetrack.reminders.left-site-tolerance-meters=50
timetrack.sites.default-radius-meters=150

# ----- integrations (see README) -----
timetrack.integrations.task-sync-interval=PT10M
timetrack.integrations.time-entry-push-interval=PT1M
timetrack.integrations.max-push-attempts=10

timetrack.integrations.bitrix24.enabled=${BITRIX24_ENABLED:false}
timetrack.integrations.bitrix24.webhook-url=${BITRIX24_WEBHOOK_URL:}
timetrack.integrations.bitrix24.site-field=${BITRIX24_SITE_FIELD:}

# Generic HTTP connector example:
# timetrack.integrations.http.myerp.tasks-url=https://erp.example.com/minuteman/tasks
# timetrack.integrations.http.myerp.time-entries-url=https://erp.example.com/minuteman/time-entries
# timetrack.integrations.http.myerp.headers.Authorization=Bearer ${MYERP_TOKEN}

# Inbound API key for a system that pushes tasks itself:
# timetrack.integrations.inbound-api-keys.mycrm=${MYCRM_API_KEY}
